kind = "mobile"
previewPath = "/pethub-mobile/"
title = "PetHub POS Mobile"
version = "1.0.0"
id = "artifacts/pethub-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/pethub-mobile/" ]
localPort = 21337

[services.development]
run = "pnpm --filter @workspace/pethub-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pethub-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/pethub-mobile", "run", "serve" ]

[services.env]
PORT = "21337"
BASE_PATH = "/pethub-mobile/"
